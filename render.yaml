services:
  - type: web
    name: bdf-lab-01-server
    runtime: node
    plan: free
    rootDir: lab-01
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20

  - type: web
    name: bdf-lab-02-server
    runtime: node
    plan: free
    rootDir: lab-02
    buildCommand: npm install && node setup.js
    startCommand: node index.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20

  - type: web
    name: bdf-lab-03-server
    runtime: node
    plan: free
    rootDir: lab-03
    buildCommand: npm install && node database/seed.js
    startCommand: node src/server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
