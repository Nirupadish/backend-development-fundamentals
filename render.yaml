services:
  - type: web
    name: bdf-lab-01-server
    runtime: node
    plan: free
    rootDir: lab-01
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20

  - type: web
    name: bdf-lab-02-server
    runtime: node
    plan: free
    rootDir: lab-02
    buildCommand: npm ci && node setup.js
    startCommand: node index.js
    healthCheckPath: /books/
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
